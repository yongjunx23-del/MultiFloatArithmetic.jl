name: FPAN verification

on:
  pull_request:
    paths:
      - 'verification/**'
      - 'audit/**'
      - 'src/MultiFloatArithmetic.jl'
      - '.github/workflows/fpan.yml'
  push:
    branches: [main]
    paths:
      - 'verification/**'
      - 'audit/**'
      - 'src/MultiFloatArithmetic.jl'
      - '.github/workflows/fpan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fpan:
    name: ${{ matrix.spec }} structural proof obligations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: fma2
            timeout_seconds: '600'
          - spec: fma3
            timeout_seconds: '600'
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned FPANVerifier
        uses: actions/checkout@v4
        with:
          repository: dzhang314/FPANVerifier
          ref: 0a1314fa78aeab35793b7354eb097061380982e5
          path: .verification-tools/FPANVerifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python Z3 and command adapter
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.4.0
          mkdir -p .verification-tools/bin
          cat > .verification-tools/bin/z3 <<'SH'
          #!/usr/bin/env bash
          exec python "$GITHUB_WORKSPACE/verification/z3_cli.py" "$@"
          SH
          chmod +x .verification-tools/bin/z3
          echo "$GITHUB_WORKSPACE/.verification-tools/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.verification-tools/bin:$PATH"
          z3 --version
          python -c 'import z3; print("Python Z3:", z3.get_version_string())'
      - name: Verify source-mirrored FPAN
        env:
          FPAN_LOG: fpan-${{ matrix.spec }}.log
          FPAN_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          PYTHONUNBUFFERED: '1'
        run: >-
          bash verification/run_fpan.sh
          .verification-tools/FPANVerifier
          verification/${{ matrix.spec }}.fpan
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpan-${{ matrix.spec }}-log
          path: fpan-${{ matrix.spec }}.log
          if-no-files-found: warn
          retention-days: 30

  verify-qw-v4-relations:
    name: QW v4 ${{ matrix.relation }} strong non-overlap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - relation: z0-z1
            prove: 'prove p00 strongly_dominates p01'
          - relation: z1-z2
            prove: 'prove p01 strongly_dominates p02'
          - relation: z2-z3
            prove: 'prove p02 strongly_dominates e02'
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned FPANVerifier
        uses: actions/checkout@v4
        with:
          repository: dzhang314/FPANVerifier
          ref: 0a1314fa78aeab35793b7354eb097061380982e5
          path: .verification-tools/FPANVerifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python Z3 and command adapter
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.4.0
          mkdir -p .verification-tools/bin
          cat > .verification-tools/bin/z3 <<'SH'
          #!/usr/bin/env bash
          exec python "$GITHUB_WORKSPACE/verification/z3_cli.py" "$@"
          SH
          chmod +x .verification-tools/bin/z3
          echo "$GITHUB_WORKSPACE/.verification-tools/bin" >> "$GITHUB_PATH"
      - name: Build one-obligation QW v4 spec
        shell: bash
        env:
          PROVE_LINE: ${{ matrix.prove }}
        run: |
          set -euo pipefail
          sed '/^prove p00 strongly_dominates p01$/,$d' verification/paper2607_qw_v4.fpan \
            > paper2607-qw-v4-one.fpan
          printf '%s\n' "$PROVE_LINE" >> paper2607-qw-v4-one.fpan
          tail -n 8 paper2607-qw-v4-one.fpan
      - name: Verify one QW v4 output relation
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.verification-tools/bin:$PATH"
          timeout --signal=TERM --kill-after=15s 1500s \
            python3 -u .verification-tools/FPANVerifier/verify_fpan.py \
            paper2607-qw-v4-one.fpan \
            | tee fpan-paper2607-qw-v4-${{ matrix.relation }}.log
          ! grep -q '^ERROR:' fpan-paper2607-qw-v4-${{ matrix.relation }}.log
          grep -E 'strongly_dominates.*proved by' fpan-paper2607-qw-v4-${{ matrix.relation }}.log
      - name: Upload QW v4 proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpan-paper2607-qw-v4-${{ matrix.relation }}-log
          path: fpan-paper2607-qw-v4-${{ matrix.relation }}.log
          if-no-files-found: warn
          retention-days: 30

  audit-former-qw-two-pass:
    name: Former QW two-pass expected non-overlap refutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned FPANVerifier
        uses: actions/checkout@v4
        with:
          repository: dzhang314/FPANVerifier
          ref: 0a1314fa78aeab35793b7354eb097061380982e5
          path: .verification-tools/FPANVerifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python Z3 and command adapter
        run: |
          python -m pip install --disable-pip-version-check z3-solver==4.13.4.0
          mkdir -p .verification-tools/bin
          cat > .verification-tools/bin/z3 <<'SH'
          #!/usr/bin/env bash
          exec python "$GITHUB_WORKSPACE/verification/z3_cli.py" "$@"
          SH
          chmod +x .verification-tools/bin/z3
          echo "$GITHUB_WORKSPACE/.verification-tools/bin" >> "$GITHUB_PATH"
      - name: Reproduce former two-pass proof pattern
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.verification-tools/bin:$PATH"
          timeout --signal=TERM --kill-after=15s 1500s \
            python3 -u .verification-tools/FPANVerifier/verify_fpan.py \
            --show-counterexamples \
            verification/paper2607_qw_v1_2pass.fpan \
            > fpan-paper2607-qw-v1-2pass.log 2>&1
          cat fpan-paper2607-qw-v1-2pass.log

          ! grep -q 'fast_two_sum command.*invalid' fpan-paper2607-qw-v1-2pass.log
          test "$(grep -c '^ERROR:' fpan-paper2607-qw-v1-2pass.log)" -eq 2
          grep -E '^ERROR: p00 strongly_dominates p01.*REFUTED' fpan-paper2607-qw-v1-2pass.log
          grep -E '^ERROR: p01 strongly_dominates p02.*REFUTED' fpan-paper2607-qw-v1-2pass.log
          grep -E '^p02 strongly_dominates e02.*proved by' fpan-paper2607-qw-v1-2pass.log
      - name: Upload former-QW diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpan-paper2607-qw-v1-2pass-log
          path: fpan-paper2607-qw-v1-2pass.log
          if-no-files-found: warn
          retention-days: 30
