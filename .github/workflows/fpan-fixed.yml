name: FPAN x4 all-TwoSum repair A/B

on:
  pull_request:
    paths:
      - '.github/scripts/run_fpan_fixed_precision.sh'
      - '.github/workflows/fpan-fixed.yml'
      - 'verification/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-repair-candidates:
    name: x4 ${{ matrix.candidate }} p=${{ matrix.precision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate: [fma4_repair_d, fma4_repair_e]
        precision: [24, 53]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned FPANVerifier
        uses: actions/checkout@v4
        with:
          repository: dzhang314/FPANVerifier
          ref: 0a1314fa78aeab35793b7354eb097061380982e5
          path: .verification-tools/FPANVerifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native and Python Z3
        run: bash verification/install_z3.sh .verification-tools
      - name: Verify candidate
        env:
          FPAN_TIMEOUT_SECONDS: '600'
        run: >-
          bash .github/scripts/run_fpan_fixed_precision.sh
          .verification-tools/FPANVerifier
          ${{ matrix.precision }}
          verification/${{ matrix.candidate }}.fpan
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpan-${{ matrix.candidate }}-p${{ matrix.precision }}-log
          path: fpan-fixed-p${{ matrix.precision }}.log
          if-no-files-found: warn
          retention-days: 30
