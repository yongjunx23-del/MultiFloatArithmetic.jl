name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia-version }} correctness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
          - os: ubuntu-latest
            julia-version: '1'
          - os: macos-latest
            julia-version: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Version information
        run: julia --project=. -e 'using InteractiveUtils; versioninfo()'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test with bounds checking
        run: julia --check-bounds=yes --project=. -e 'using Pkg; Pkg.test(; coverage=false)'

  smoke-benchmark:
    name: Arithmetic smoke and codegen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run scalar and Vec4 FMA smoke benchmark
        run: julia --project=. benchmark/smoke.jl
      - name: Run SIMD-width FMA smoke benchmark
        run: julia --project=. benchmark/simd_widths.jl
      - name: Measure Float64x3 proof-repair overhead
        run: julia --project=. benchmark/fma3_repair.jl
      - name: Measure Float64x4 safe-baseline overhead
        run: julia --project=. benchmark/fma4_safe.jl
      - name: Measure Float64x5 safe-addition discarded tail
        run: julia --project=. benchmark/add5_safe.jl
      - name: Measure Float64x6-x8 safe-addition discarded tails
        run: julia --project=. benchmark/add6_add8_safe.jl
      - name: Measure Float64x5 safe-multiplication discarded tail
        run: julia --project=. benchmark/mul5_safe.jl
      - name: Measure Float64x6-x8 safe-multiplication discarded tails
        run: julia --project=. benchmark/mul6_mul8_safe.jl
      - name: Measure Float64x5 direct-FMA discarded tail
        run: julia --project=. benchmark/fma5_safe.jl
      - name: Compare BigFloat and MultiFloat precision/speed
        run: julia --project=. benchmark/bigfloat_multifloat_comparison.jl
      - name: Run rejected quotient-digit division A/B
        run: julia --project=. benchmark/division_digits.jl
      - name: Inspect FMA codegen metrics
        run: julia --project=. benchmark/codegen.jl
