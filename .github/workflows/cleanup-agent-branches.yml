name: One-time stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-agent-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete stale agent branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin 'refs/heads/agent/*' |
              awk '{sub("refs/heads/", "", $2); print $2}'
          )
          printf 'Deleting %d stale agent branches\n' "${#branches[@]}"
          printf '  %s\n' "${branches[@]}"
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch"
          done
